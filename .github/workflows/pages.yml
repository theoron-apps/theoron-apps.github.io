# Builds and deploys the site to GitHub Pages, refreshing data/releases.json
# from the GitHub API first (visitors' browsers never call the API).
#
# Every push deploys. Every 15 minutes a quick check looks for new app releases
# and deploys only when there are some, so versions on the site follow releases.
#
# Requires the repository's Pages source to be "GitHub Actions":
# Settings → Pages → Build and deployment → Source → GitHub Actions.

name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Scheduled runs only: is there anything new to show?
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest releases
        run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare with the live site
        id: compare
        run: node scripts/releases-changed.mjs

  deploy:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    # one deploy at a time; checks may run alongside
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest releases
        run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build _site
        run: rsync -a --exclude /.git --exclude /.github --exclude /scripts --exclude /README.md --exclude /_site ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
